[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    #https://github.com/Makerfabs/Makerfabs-ESP32-UWB-DW3000.git
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO

board_microros_distro = humble     # change to iron / jazzy / rolling if you use a different ROS 2 distro
board_microros_transport = wifi

build_flags = 
    -D RMW_UXRCE_TRANSPORT_UDP
    -D MAX_IP_LEN=16
    -D UXRCE_TRANSPORT_UDP_IP=UDP_IPV4
; ================== BASE FOR NON-ROS BOARDS (Anchors) ==================
; Anchors are pure SPI/UWB responders (Arduino.h + SPI.h only, no WiFi or
; micro-ROS) so they extend this lean base instead of env:esp32dev. Extending
; env:esp32dev would pull in the micro_ros_platformio lib_dep, and since each
; PlatformIO environment name gets its own from-scratch library build, that
; means a 10+ minute micro-ROS rebuild per anchor env for a dependency the
; anchor firmware never uses.
[env:esp32dev_anchor]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ================== ANCHORS (Responders) ==================
; Each anchor's ANCHOR_ID/ANTENNA_DELAY_INIT is a build flag here rather than
; a hand-edited constant in range_anchor.cpp, so all three anchors' current
; calibration is visible and version-controlled in one place. To reflash a
; given physical anchor: pio run -e anchor2 -t upload --upload-port <port>
[env:anchor1]
extends = env:esp32dev_anchor
build_src_filter = +<range_anchor.cpp> -<main.cpp> -<range_tag.cpp> -<range_tag_IMU.cpp> -<range_tag_IMU_v2.cpp>
build_flags =
    -D ANCHOR_ID=1
    -D ANTENNA_DELAY_INIT=16551

[env:anchor2]
extends = env:esp32dev_anchor
build_src_filter = +<range_anchor.cpp> -<main.cpp> -<range_tag.cpp> -<range_tag_IMU.cpp> -<range_tag_IMU_v2.cpp>
build_flags =
    -D ANCHOR_ID=2
    -D ANTENNA_DELAY_INIT=17131

[env:anchor3]
extends = env:esp32dev_anchor
build_src_filter = +<range_anchor.cpp> -<main.cpp> -<range_tag.cpp> -<range_tag_IMU.cpp> -<range_tag_IMU_v2.cpp>
build_flags =
    -D ANCHOR_ID=3
    -D ANTENNA_DELAY_INIT=16952

; ================== TAG (Initiator) ==================
[env:tag]
extends = env:esp32dev
build_src_filter = +<range_tag.cpp> -<main.cpp> -<range_anchor.cpp>
lib_archive = false

[env:tag_IMU]
extends = env:esp32dev
build_src_filter = +<range_tag_IMU.cpp> -<main.cpp> -<range_anchor.cpp> -<range_tag.cpp>
lib_archive = false

[env:tag_IMU_v2]
extends = env:esp32dev
build_src_filter = +<range_tag_IMU_v2.cpp> -<main.cpp> -<range_anchor.cpp> -<range_tag.cpp>
lib_archive = false